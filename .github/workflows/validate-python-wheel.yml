name: Validate Python wheel

on:
  pull_request:
    branches:
      - 4.9.0
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: opencv-das-wheel-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wheel:
    # Secrets are not provided to pull requests opened from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Build and test downstream Python wheel
    uses: HYGON-AI/opencv-python-das/.github/workflows/pr-build.yml@ci/add-wheel-workflow
    with:
      opencv_ref: ${{ github.event.pull_request.head.sha }}
      wrapper_ref: ci/add-wheel-workflow
    secrets: inherit
