name: Build and test with DTK

on:
  pull_request:
    branches:
      - 4.9.0
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencv-das-dtk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
  MAX_JOBS: "32"
  # Keep the CUDA module dependency deterministic. Update this deliberately
  # together with the compatible opencv_contrib-das revision.
  OPENCV_CONTRIB_REF: 4dded4dbcfe15ef625fe603d9f03789d750c7368

jobs:
  build-and-test:
    name: Build and test CUDA modules
    runs-on: self-hosted
    timeout-minutes: 240
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
      options: >-
        --device=/dev/kfd
        --device=/dev/dri/
        --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout matching OpenCV contrib modules
        uses: actions/checkout@v4
        with:
          repository: HYGON-AI/opencv_contrib-das
          ref: ${{ env.OPENCV_CONTRIB_REF }}
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          path: opencv_contrib
          fetch-depth: 1
          persist-credentials: false

      - name: Install DTK and build dependencies
        shell: bash
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: bash .github/scripts/install_dtk_dependencies.sh

      - name: Configure, build, and test OpenCV
        shell: bash
        run: bash .github/scripts/build_and_test_dtk.sh
